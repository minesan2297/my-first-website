<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thẻ sản phẩm - Product Card Component</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Container chính của Product Card -->
    <div class="product-card">
      <!-- Ảnh sản phẩm -->
      <img src="images/avatar.jpg" alt="Tai nghe không dây chống ồn cao cấp" />

      <!-- Tên sản phẩm -->
      <h3>Tai Nghe Bluetooth Pro</h3>

      <!-- Giá tiền -->
      <p class="price">1.250.000 đ</p>

      <!-- Nút hành động -->
      <a href="#" class="btn">Thêm vào giỏ hàng</a>
    </div>
  </body>
</html>
