<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thời Khóa Biểu Cá Nhân</title>
  </head>
  <body>
    <h1>Thời Khóa Biểu Tuần</h1>

    <table>
      <!-- Phân vùng tiêu đề bảng -->
      <thead>
        <tr>
          <th>Thời gian</th>
          <th>Thứ Hai</th>
          <th>Thứ Ba</th>
          <th>Thứ Tư</th>
          <th>Thứ Năm</th>
          <th>Thứ Sáu</th>
        </tr>
      </thead>

      <!-- Phân vùng dữ liệu bảng -->
      <tbody>
        <!-- Hàng 1: Buổi Sáng -->
        <tr>
          <th>Sáng (8:00 - 12:00)</th>
          <td>Học HTML</td>
          <td>Họp nhóm</td>
          <td>Học HTML</td>
          <td>Họp nhóm</td>
          <td>Tổng kết tuần</td>
        </tr>

        <!-- Hàng 2: Buổi Chiều -->
        <tr>
          <th>Chiều (13:30 - 17:00)</th>
          <td>Làm bài tập</td>
          <td>Dự án phụ</td>
          <td>Làm bài tập</td>
          <td>Dự án phụ</td>
          <td>Chơi điện tử</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
